# Render blueprint: ProfitPilot AI backend (free tier).
# Deploy via Dashboard -> New -> Blueprint, pointing at this repo.
# Free-tier notes: the service sleeps after inactivity (first request is
# slow), and the SQLite DB + uploaded sessions are ephemeral (wiped on
# restart). Demo data ships in the repo, so investigations always work.
services:
  - type: web
    name: profitpilot-api
    runtime: python
    plan: free
    # Meta's Model API 404s this model from Frankfurt egress; production runs in Oregon.
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: MODEL_NAME
        value: muse-spark-1.3
      - key: META_API_BASE_URL
        value: https://api.meta.ai/v1
      - key: MODEL_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
